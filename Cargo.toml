[package]
name = "smu_bid_analyser"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.31"
egui_plot = "0.31"
# Reads the raw BOSS exports (.xls and .xlsx) directly, no Python/parquet step needed.
calamine = "0.31"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nucleo = "0.5.0"
chrono = "0.4"
dirs = "6.0.0"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# The CLI integration tests (tests/cli.rs) write their own BOSS-style workbooks into a temp folder.
rust_xlsxwriter = "0.99"
tempfile = "3"
